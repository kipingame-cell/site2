<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1b1530"/>
      <stop offset="55%" stop-color="#120e20"/>
      <stop offset="100%" stop-color="#0a0812"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d68a"/>
      <stop offset="100%" stop-color="#c9a24b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- звёздная пыль -->
  <g fill="#f0d68a" opacity="0.5">
    <circle cx="120" cy="90" r="1.6"/><circle cx="230" cy="60" r="1.1"/><circle cx="330" cy="130" r="1.4"/>
    <circle cx="90" cy="300" r="1.2"/><circle cx="180" cy="500" r="1.5"/><circle cx="70" cy="560" r="1"/>
    <circle cx="1080" cy="80" r="1.5"/><circle cx="1130" cy="220" r="1.1"/><circle cx="1010" cy="150" r="1.3"/>
    <circle cx="1120" cy="520" r="1.6"/><circle cx="990" cy="570" r="1.1"/><circle cx="420" cy="70" r="1.2"/>
    <circle cx="780" cy="60" r="1.4"/><circle cx="880" cy="110" r="1"/><circle cx="60" cy="430" r="1.3"/>
  </g>

  <!-- октаграмма -->
  <g transform="translate(600,268)" fill="none">
    <rect x="-135" y="-135" width="270" height="270" stroke="#8b7bd8" stroke-width="2.5" opacity="0.9"/>
    <rect x="-135" y="-135" width="270" height="270" stroke="#4fc3b8" stroke-width="2.5" opacity="0.9"
          transform="rotate(45)"/>
    <circle r="8" fill="url(#gold)" stroke="none"/>
    <g fill="#8b7bd8" stroke="none">
      <circle cx="0" cy="-135" r="7"/><circle cx="-135" cy="0" r="7"/>
      <circle cx="135" cy="0" r="7"/><circle cx="0" cy="135" r="7"/>
    </g>
    <g fill="#4fc3b8" stroke="none">
      <circle cx="95.5" cy="-95.5" r="6"/><circle cx="-95.5" cy="-95.5" r="6"/>
      <circle cx="-95.5" cy="95.5" r="6"/><circle cx="95.5" cy="95.5" r="6"/>
    </g>
  </g>

  <!-- рамка -->
  <rect x="26" y="26" width="1148" height="578" fill="none" stroke="#c9a24b" stroke-width="1.5" opacity="0.55"/>
  <rect x="34" y="34" width="1132" height="562" fill="none" stroke="#c9a24b" stroke-width="0.6" opacity="0.4"/>

  <!-- подписи -->
  <text x="600" y="520" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="72" letter-spacing="14" fill="url(#gold)">МАТРИЦА СУДЬБЫ</text>
  <text x="600" y="568" text-anchor="middle" font-family="Georgia, serif"
        font-size="24" letter-spacing="6" fill="#b9b0d8">22 АРКАНА · ПОЛНЫЙ РАЗБОР · БЕСПЛАТНО</text>

  <!-- ромбики по бокам заголовка -->
  <g fill="#c9a24b">
    <path d="M 212 506 l 7 7 -7 7 -7 -7 z"/>
    <path d="M 988 506 l 7 7 -7 7 -7 -7 z"/>
  </g>
  <g stroke="#c9a24b" stroke-width="0.8" opacity="0.7">
    <line x1="120" y1="513" x2="204" y2="513"/>
    <line x1="996" y1="513" x2="1080" y2="513"/>
  </g>
</svg>
